version = 0.1

[dev.build.parameters]
cached = true
parallel = true

[dev.deploy.parameters]
stack_name = "dev-indicadores-personal-api"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
s3_prefix = "dev-indicadores-personal-api"
parameter_overrides = [
  "Environment=dev",
  "VpcSubnetIds=/dev/indicadores-personal/network/subnets",
  "LambdaSecurityGroupId=/dev/indicadores-personal/network/lambda-sg",
  "DbProxyEndpoint=/dev/indicadores-personal/db/proxy-endpoint",
  "DbSecretName=/dev/indicadores-personal/db/app",
  "DbName=olo_dev_indicadores_personal_db",
  "AllowedOrigins=/dev/indicadores-personal/frontend/origin",
]
tags = [
  "Project=INDICADORES_PERSONAL",
  "Environment=DEV",
  "Name=dev-indicadores-personal-api",
]

