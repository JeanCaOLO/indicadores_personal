  CreateUsuarioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-create-usuario'
      Description: INDICADORES_PERSONAL - CREATE_USUARIO | POST /usuarios
      Handler: entrypoints.lambda_handlers.usuarios.create_usuario_handler
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref 'CreateUsuarioLogGroup'
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !If
          - CreateUserPool
          - !Ref 'UserPool'
          - !Select
            - 1
            - !Split
              - /
              - !Ref 'CognitoUserPoolArn'
      Events:
        PostUsuarios:
          Type: Api
          Properties:
            RestApiId: !Ref 'Api'
            Path: /usuarios
            Method: post
      Role: !GetAtt 'CognitoAdminDbRole.Arn'
