  CognitoAdminDbRole:
    Type: AWS::IAM::Role
    Properties:
      Description: 'INDICADORES_PERSONAL - rol compartido por 2 función(es): cognito_admin, db'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: least-privilege
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: WriteOwnLogs
            Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - !GetAtt 'CreateUsuarioLogGroup.Arn'
            - !GetAtt 'DeleteUsuarioLogGroup.Arn'
          - Sid: VpcNetworkInterfaces
            Effect: Allow
            Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
            - ec2:AssignPrivateIpAddresses
            - ec2:UnassignPrivateIpAddresses
            Resource: '*'
          - Sid: ReadDbSecret
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-??????'
          - Sid: CognitoAdmin
            Effect: Allow
            Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            Resource: !If
            - CreateUserPool
            - !GetAtt 'UserPool.Arn'
            - !Ref 'CognitoUserPoolArn'
  DbRole:
    Type: AWS::IAM::Role
    Properties:
      Description: 'INDICADORES_PERSONAL - rol compartido por 8 función(es): db'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: least-privilege
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: WriteOwnLogs
            Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - !GetAtt 'DeleteRoleLogGroup.Arn'
            - !GetAtt 'GetCurrentAccessLogGroup.Arn'
            - !GetAtt 'ListIndicadoresRegistrosLogGroup.Arn'
            - !GetAtt 'ListRolesLogGroup.Arn'
            - !GetAtt 'ListUsuariosLogGroup.Arn'
            - !GetAtt 'SaveIndicadoresRegistrosLogGroup.Arn'
            - !GetAtt 'SaveRoleLogGroup.Arn'
            - !GetAtt 'UpdateUsuarioLogGroup.Arn'
          - Sid: VpcNetworkInterfaces
            Effect: Allow
            Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
            - ec2:AssignPrivateIpAddresses
            - ec2:UnassignPrivateIpAddresses
            Resource: '*'
          - Sid: ReadDbSecret
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}-??????'
Outputs:
  UserPoolId:
    Condition: CreateUserPool
    Value: !Ref 'UserPool'
    Description: COGNITO_USER_POOL_ID del frontend
  UserPoolClientId:
    Condition: CreateUserPool
    Value: !Ref 'UserPoolClient'
    Description: COGNITO_CLIENT_ID del frontend
  ApiUrl:
    Description: URL base del API (VITE_/NEXT_PUBLIC_/REACT_APP_API_BASE_URL)
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
