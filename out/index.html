<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indicadores de Personal · OLO</title>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12201C;--ink-2:#3B4642;--muted:#77817C;--faint:#9AA39E;
    --line:#E7EAE8;--line-2:#D3D8D5;--bg:#F3F5F4;--surface:#FFFFFF;--surface-2:#FAFBFB;
    --teal:#00B497;--teal-deep:#009C82;--teal-d:#00654F;--teal-wash:#EAF6F2;--olo:#00A885;
    --ok:#0A7A55;--okbg:#E4F4EC;--warn:#B77E1B;--warnbg:#F8F0DE;--danger:#B23A2E;--dangerbg:#FAEAE7;
    --shadow:0 1px 2px rgba(18,32,28,.04),0 1px 3px rgba(18,32,28,.06);
    --shadow-lg:0 8px 30px rgba(18,32,28,.10);
    --r:14px;--r-s:9px;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:14.5px}
  .num{font-family:'Space Grotesk','Inter',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:0;background:none}
  select{font-family:inherit}

  /* header */
  header.app{background:var(--surface);border-bottom:1px solid var(--line)}
  .app-inner{max-width:1280px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:14px}
  .logo .mark img{height:40px;width:auto;display:block}
  .logo .divider{width:1px;height:34px;background:var(--line-2)}
  .logo .txt small{display:block;font-weight:500;font-size:10.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
  .logo .txt b{font-family:'Space Grotesk';font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
  .hactions{margin-left:auto;display:flex;gap:9px}
  .hbtn{border:1px solid var(--teal);background:var(--teal);color:#fff;padding:9px 16px;border-radius:var(--r-s);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:.14s}
  #accSel,#accSel:focus,#accSel:hover,#accSel:active{background:#fff;color:#111;outline:none;accent-color:#111}
  #accSel option{background:#fff;color:#111}
  #accSel option:checked,#accSel option:hover{background:#f0f0f0;color:#111}
  .hbtn:hover{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
  .hbtn.solid{background:var(--teal-d);color:#fff;border-color:var(--teal-d)}
  .hbtn.solid:hover{background:#00543f;color:#fff}

  /* filter bar */
  .filters{background:rgba(243,245,244,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .stickytop{position:sticky;top:0;z-index:30}
  .pillnav{max-width:1280px;margin:0 auto;padding:10px 28px;display:flex;flex-direction:column;gap:8px;background:var(--surface);border-bottom:1px solid var(--line)}
  .pillnav .pill-row{display:flex;flex-wrap:nowrap;gap:7px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px;scroll-behavior:smooth}
  .pillnav .pill-row::-webkit-scrollbar{height:6px}
  .pillnav .pill-row::-webkit-scrollbar-thumb{background:#d5ddda;border-radius:6px}
  .pillnav .dseg-row{display:flex;justify-content:flex-end}
  .pillnav .pill{flex:0 0 auto;text-align:center;font-family:'Space Grotesk';font-weight:600;font-size:12.5px;color:var(--muted);background:#f4f7f6;border:1px solid transparent;border-radius:9px;padding:8px 15px;cursor:pointer;white-space:nowrap;transition:transform .12s,color .15s,background .15s,border-color .15s,box-shadow .15s}
  .pillnav .pill:hover{color:var(--ink);background:#eaf3f0;border-color:#cfe3dd}
  .pillnav .pill.active{color:#fff;background:var(--teal);border-color:var(--teal);box-shadow:0 3px 10px rgba(0,180,151,.28);transform:translateY(-1px)}
  .pillnav .pill.active:hover{background:var(--teal-d);border-color:var(--teal-d)}
  .pillnav .dseg-wrap{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:center;background:#fff}
  .pillnav .dseg{border:none;background:transparent;color:var(--muted);font-family:'Space Grotesk';font-weight:600;font-size:11.5px;padding:6px 13px;cursor:pointer}
  .pillnav .dseg+.dseg{border-left:1px solid var(--line)}
  .pillnav .dseg.active{background:var(--teal);color:#fff}
  .sec,.cover{scroll-margin-top:150px}
  .filters-inner{max-width:1280px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .fgroup{display:flex;align-items:center;gap:9px}
  .fgroup label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .fgroup select,.period select{appearance:none;border:1.5px solid var(--teal);background:#fff;border-radius:var(--r-s);padding:9px 34px 9px 13px;font-size:14px;font-weight:600;color:var(--teal-d);box-shadow:var(--shadow);
    background-image:url("data:image/svg+xml,%3Csvg width='12' height='7' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%2300654F' stroke-width='2' fill='none' fill-rule='evenodd'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 13px center}
  .fgroup select:hover,.period select:hover{background-color:var(--teal-wash)}
  .fgroup select:focus,.period select:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,180,151,.15)}
  .fgroup.primary label{color:var(--teal-d)}
  .fgroup.primary select{font-size:15.5px;font-weight:700}
  .fgroup.primary select:hover{background-color:var(--teal-wash)}
  .fspacer{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .fspacer b{color:var(--ink-2);font-weight:600}

  main{max-width:1280px;margin:0 auto;padding:26px 28px 90px}
  .view{display:none} .view.active{display:block}

  /* executive strip */
  .exec{display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:26px}
  @media(max-width:900px){.exec{grid-template-columns:repeat(2,1fr)}} @media(max-width:520px){.exec{grid-template-columns:1fr}}
  .exec .cell{padding:18px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .exec .cell .l{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:9px}
  .exec .cell .v{font-family:'Space Grotesk';font-weight:700;font-size:29px;line-height:1;color:var(--ink)}
  .exec .cell .v .u{font-size:15px;color:var(--faint);font-weight:600;margin-left:2px}
  .exec .cell .d{font-size:12px;font-weight:600;margin-top:8px}
  .exec .cell .d.up{color:var(--danger)}.exec .cell .d.down{color:var(--ok)}.exec .cell .d.gup{color:var(--ok)}.exec .cell .d.gdown{color:var(--danger)}.exec .cell .d.flat{color:var(--muted)}

  /* section */
  .sec{margin-top:34px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .sec-head .eb{font-family:'Space Grotesk';font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--teal);padding:5px 11px;border-radius:6px;box-shadow:0 1px 2px rgba(0,180,151,.28)}
  .sec-head h2{font-family:'Space Grotesk';font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;color:var(--ink)}
  .sec-head .note{margin-left:auto;font-size:12px;color:var(--muted)}
  .sec-head{cursor:pointer;user-select:none}
  .sec-head .schev{font-size:12px;color:var(--muted);transition:transform .18s;padding:2px 4px}
  .sec.collapsed>*:not(.sec-head){display:none!important}
  .sec.collapsed .sec-head{margin-bottom:0}
  .sec.collapsed .schev{transform:rotate(-90deg)}
  .card>.ch{cursor:pointer;user-select:none}
  .card>.ch .cchev{margin-left:auto;font-size:11px;color:var(--muted);transition:transform .18s;padding:2px 4px;flex:none}
  .card.collapsed>*:not(.ch){display:none!important}
  .card.collapsed>.ch .cchev{transform:rotate(-90deg)}
  .ablk{margin-top:30px}
  tr.tgrp{user-select:none}
  tr.tgrp td:hover{filter:brightness(.97)}
  .tchev{display:inline-block;color:var(--teal-d);font-size:11px;transition:transform .18s;margin-right:4px}
  tr.tgrp.collapsed .tchev{transform:rotate(-90deg)}

  .legend{display:flex;gap:16px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:14px}
  .legend .it{display:inline-flex;align-items:center;gap:6px}
  .legend .dot{width:9px;height:9px;border-radius:50%}
  .dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.danger{background:var(--danger)}.dot.na{background:var(--line-2)}

  .kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .kpi-grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:560px){.kpi-grid{grid-template-columns:1fr}}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px 18px 15px;box-shadow:var(--shadow);position:relative;transition:.15s}
  .kpi:hover{box-shadow:var(--shadow-lg);border-color:var(--line-2)}
  .kpi .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
  .kpi .kname{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.35}
  .kpi .sem{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px}
  .sem.ok{background:var(--ok)}.sem.warn{background:var(--warn)}.sem.danger{background:var(--danger)}.sem.na{background:var(--line-2)}
  .kpi .valrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .kpi .kval{font-family:'Space Grotesk';font-weight:700;font-size:33px;line-height:.95;color:var(--ink)}
  .kpi .kval .u{font-size:15px;color:var(--faint);font-weight:600;margin-left:2px}
  .kpi .spark{display:flex;align-items:flex-end;gap:4px;height:32px;flex:1;min-width:130px;margin-left:18px;overflow:hidden}
  .kpi .spark .b{flex:1;min-width:0;background:var(--line);border-radius:3px 3px 0 0;min-height:2px;cursor:default}
  .esl-dot{width:12px;height:12px;border-radius:50%;flex:none}
  .esl-badge{font-family:'Space Grotesk';font-weight:700;font-size:12.5px;color:#fff;padding:6px 13px;border-radius:8px;white-space:nowrap;align-self:center;box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .kpi .spark .b.cur{background:var(--teal)}
  .kpi .spark.esl{height:auto;align-items:flex-end;gap:6px}
  .kpi .spark.esl .esc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end}
  .kpi .spark.esl .escwrap{width:100%;height:32px;display:flex;align-items:flex-end}
  .kpi .spark.esl .escbar{width:100%;border-radius:2px 2px 0 0;min-height:3px}
  .kpi .spark.esl .escyr{font-family:'Space Grotesk';font-weight:600;font-size:9.5px;color:var(--faint);line-height:1;white-space:nowrap}
  .kpi .spark.esl .escyr.cur{color:var(--ink);font-weight:700}
  .esl-rows{display:flex;flex-direction:column;gap:9px;margin-top:14px}
  .esl-rows .esl-row{display:flex;align-items:center;gap:10px}
  .esl-rows .esl-ryr{width:40px;flex:none;font-family:'Space Grotesk';font-weight:700;font-size:12px;color:var(--ink-2)}
  .esl-rows .esl-row.cur .esl-ryr{color:var(--ink)}
  .esl-rows .esl-rbar{flex:1;height:10px;background:var(--wash);border-radius:6px;overflow:hidden}
  .esl-rows .esl-rfill{display:block;height:100%;border-radius:6px;transition:width .3s}
  .esl-rows .esl-rval{width:42px;flex:none;text-align:right;font-weight:700;font-size:13px}
  .kpi .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .kpi .delta{font-size:12px;font-weight:600}
  .delta.up{color:var(--danger)}.delta.down{color:var(--ok)}.delta.gup{color:var(--ok)}.delta.gdown{color:var(--danger)}.delta.flat{color:var(--muted)}
  .kpi .target{font-size:11px;color:var(--faint);font-family:'Space Grotesk'}
  .kpi .def{font-size:10.5px;color:var(--faint);margin-top:9px;line-height:1.45}
  .kpi .bypais{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:9.5px;color:var(--muted)}
  .kpi .bypais .pc{white-space:nowrap} .kpi .bypais b{font-family:'Space Grotesk';color:var(--teal-d);font-size:9.5px;margin-right:1px}

  /* cards & tables */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .cols{display:grid;gap:16px} .cols.c2{grid-template-columns:1fr 1fr} .cols.c3{grid-template-columns:1.4fr 1fr 1fr}
  @media(max-width:900px){.cols.c2,.cols.c3{grid-template-columns:1fr}}
  .ch{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
  .ch h3{font-family:'Space Grotesk';margin:0;font-size:15.5px;font-weight:600}
  .ch .hint{font-size:11.5px;color:var(--muted);font-weight:500}
  .cb{padding:6px 8px 10px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:right;padding:9px 14px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  tbody tr:last-child td{border-bottom:0}
  td.num,th.num{font-family:'Space Grotesk';font-variant-numeric:tabular-nums}
  tr.grp td{background:var(--teal-wash);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--teal)}
  tr.subg td{background:#fff;font-weight:600;font-size:12px;color:var(--teal-d);border-top:1px solid var(--line-2);padding-left:18px}
  tr.sub td{font-weight:600;border-top:1px solid var(--line-2);background:#fff}
  tr.total td{font-weight:700;border-top:2px solid var(--line-2);background:var(--surface-2)}
  .barcell{position:relative}
  .bar-row{display:flex;align-items:center;gap:12px;padding:7px 6px;font-size:13.5px}
  .bar-row .bl{width:170px;flex:none;color:var(--ink-2)}
  .bar-row .bt{flex:1;background:var(--line);border-radius:6px;height:9px;overflow:hidden}
  .bar-row .bf{height:100%;background:var(--teal);border-radius:6px}
  .bar-row .bv{width:52px;text-align:right;font-family:'Space Grotesk';font-weight:600}
  .empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px}
  .empty b{color:var(--ink-2);display:block;margin-bottom:4px;font-size:14px}

  /* admin */
  .adm-head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  .adm-head h2{font-family:'Space Grotesk';font-size:22px;margin:0;font-weight:700}
  .banner{background:var(--teal-wash);border:1px solid #BEE4DA;color:var(--teal-d);border-radius:var(--r-s);padding:12px 16px;font-size:13px;margin:14px 0 22px;line-height:1.5}
  .adm-card{margin-bottom:18px}
  .autobox{background:var(--teal-wash);border:1px solid var(--line-2);border-left:4px solid var(--teal-d);border-radius:10px;padding:13px 16px;font-size:13px;line-height:1.6;color:var(--ink-2);margin-top:12px}
  .period{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--teal);border-radius:12px;padding:12px 16px;margin-top:6px}
  .period .plabel{font-family:'Space Grotesk';font-weight:700;color:var(--teal-d);font-size:14px}
  .period .phelp{font-size:12.5px;color:var(--muted)}
  .tip{position:fixed;z-index:9999;width:max-content;max-width:min(560px,92vw);max-height:62vh;overflow:auto;background:#fff;color:var(--ink);border:1px solid rgba(0,101,79,.16);border-radius:9px;padding:9px 12px;font-size:11.5px;line-height:1.4;box-shadow:0 10px 30px rgba(0,101,79,.12);pointer-events:none;opacity:0;transition:opacity .1s;display:none}
  .tip.on{opacity:1;display:block}
  .tip b{color:var(--teal-d);font-family:'Space Grotesk';font-size:11.5px}
  .tip .tl{margin-top:5px;border-top:1px solid var(--teal-wash);padding-top:5px}
  .tip .tl.two{column-count:2;column-gap:12px}
  .tip .tl.three{column-count:3;column-gap:12px}
  .tip .tl>div{padding:.5px 0;color:var(--ink-2);white-space:normal;overflow-wrap:anywhere;break-inside:avoid}
  .tip .tm{color:var(--teal);margin-top:3px;font-style:italic;font-weight:600;column-span:all}
  [data-tip]{cursor:help}
  .adm-sec{display:flex;align-items:center;gap:10px;margin:24px 0 4px}
  .adm-step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--teal-d);color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:13px}
  .adm-sec-t{font-family:'Space Grotesk';font-weight:700;font-size:16px;color:var(--ink)}
  .up-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
  @media(max-width:820px){.up-grid{grid-template-columns:1fr}}
  .up-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;box-shadow:0 1px 2px rgba(16,40,34,.04)}
  .up-head{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
  .up-ttl h3{margin:0;font-family:'Space Grotesk';font-size:15px;font-weight:700;color:var(--ink)}
  .up-note{margin:5px 0 0;font-size:12px;line-height:1.5;color:var(--muted)}
  .up-status{flex:none;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--surface-2);color:var(--faint);white-space:nowrap}
  .up-status.on{background:var(--teal-wash);color:var(--teal-d)}
  .up-actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
  .up-empty{margin-top:12px;font-size:12.5px;color:var(--muted)}
  .linkbtn{background:none;border:none;color:var(--teal-d);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
  .dc-edit{margin-top:12px;border-top:1px solid var(--line-2);padding-top:8px}
  .dc-edit>summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--teal-d);list-style:none}
  .dc-edit>summary::-webkit-details-marker{display:none}
  .dc-tbl{margin-top:10px;overflow-x:auto}
  .fchev{display:inline-block;font-size:10px;transition:transform .18s}
  details[open]>summary .fchev{transform:rotate(180deg)}
  .adm-fold{margin-top:20px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px}
  .adm-fold>summary{cursor:pointer;display:flex;align-items:center;gap:10px;list-style:none}
  .adm-fold>summary::-webkit-details-marker{display:none}
  .adm-fold .adm-fold-h{font-size:12px;color:var(--muted);font-weight:500}
  .adm-fold>summary .fchev{margin-left:auto;font-size:12px}
  .actset{display:flex;gap:8px;flex-wrap:wrap}
  .mini{border:1px solid var(--teal);background:var(--teal);border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:600;color:#fff;transition:.14s}
  .mini:hover{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
  .mini.save{background:var(--teal-d);color:#fff;border-color:var(--teal-d)}
  .mini.save:hover{background:#00543f}
  .mini.danger{background:#fff;color:var(--danger);border-color:#E7C4BF}
  .mini.danger:hover{background:var(--dangerbg);color:var(--danger)}
  .row-del{color:var(--faint);font-size:17px;padding:2px 7px;border-radius:6px}.row-del:hover{color:var(--danger)}
  input[type=text],input[type=number],input[type=date],.adm select{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;font-family:inherit;font-size:13.5px;color:var(--ink);background:#fff}

"use strict";
const SEED={};

function refreshYears(){const ys=new Set([2024,2025,2026,2027]);Object.keys(DB).forEach(k=>{const m=/^(\d{4})-\d{2}$/.exec(k);if(m)ys.add(+m[1]);});YEARS=[...ys].sort((a,b)=>a-b);}
function monthsOf(y){return Array.from({length:12},(_,i)=>`${y}-${String(i+1).padStart(2,"0")}`);}
let MONTHS=monthsOf(YEAR);
const MSHORT=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MLONG=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const mi=k=>(+k.slice(5,7))-1, yOf=k=>+k.slice(0,4), mShort=k=>MSHORT[mi(k)]+" '"+String(yOf(k)).slice(2), mLong=k=>MLONG[mi(k)]+" "+yOf(k);

const MOTIVOS=["Renuncia","Despido","Finalización","Otro"];

const MOVILM=["M1","M2","M3","M4","M5","M6","M7","M7 NN"];
const MOVIMIENTO=["Sin cambio","Promoción","Ascenso"];

const PAISES=["Venezuela","Costa Rica","El Salvador","Guatemala","Colombia"];
const AREAS_CONOC=["Seguridad y salud","Liderazgo","Técnico/Operativo","Sistemas y tecnología","Calidad y procesos","Habilidades blandas","Cumplimiento/Legal","Idiomas"];
// Capacidad de años visibles en fichas históricas anuales (p. ej. Satisfacción laboral). Se muestran los más recientes hasta este máximo; los datos anteriores se conservan.
const ESL_MAX_YEARS=5;

const ASOF=TODAY;
function asofFor(k){const y=+k.slice(0,4),m=+k.slice(5,7);const monthEnd=new Date(y,m,0);return TODAY<monthEnd?TODAY:monthEnd;}
function lastAccidentDate(asof){let best=null;Object.keys(DB).forEach(mk=>{if(mk==="__cfg")return;const f=DB[mk]&&DB[mk].params&&DB[mk].params.fecha_ult_accidente;if(f){const d=new Date(f);if(!isNaN(d)&&d<=asof&&(!best||d>best))best=d;}});return best;}
function lastAccidentInfo(asof){let best=null,area="";Object.keys(DB).forEach(mk=>{if(mk==="__cfg")return;const pr=DB[mk]&&DB[mk].params;const f=pr&&pr.fecha_ult_accidente;if(f){const d=new Date(f);if(!isNaN(d)&&d<=asof&&(!best||d>best)){best=d;area=pr.accid_area||"";}}});return{date:best,area:area};}
function bizDaysInMonth(k){const y=+k.slice(0,4),m=+k.slice(5,7);let c=0,d=new Date(y,m-1,1);while(d.getMonth()===m-1){const w=d.getDay();if(w>=1&&w<=5)c++;d.setDate(d.getDate()+1);}return c;}

function barList(rows,mx,tips,vf){mx=Math.max(mx,1);const tot=rows.reduce((s,r)=>s+r[1],0)||1;const top=Math.max(...rows.map(r=>r[1]),0);const F=vf||nfmt;
  return rows.map(([l,v])=>{const dt=tips&&tips[l]?` data-tip="${tips[l].replace(/"/g,'&quot;')}"`:` title="${l}: ${F(v)} · ${(v/tot*100).toFixed(1)}% del total"`;

function shortName(full){const w=String(full||"").trim().split(/\s+/).filter(Boolean);
  if(!w.length)return "(sin nombre)";if(w.length===1)return w[0];if(w.length===2)return `${w[0]} ${w[1]}`;
  return `${w[0]} ${w[2]}`;}
function pLabel(a){return `${shortName(a.nombre)} · ${a.area||a.departamento||a.dep||"—"}`;}
function tipPeople(list,extra){const n=list.length;const sample=list.map(pLabel).sort((a,b)=>a.localeCompare(b,"es"));const cls=n>16?" three":(n>7?" two":"");
  return `<b>${n} persona${n===1?"":"s"}</b>${extra?" · "+extra:""}`+(sample.length?`<div class="tl${cls}">${sample.map(x=>`<div>${x}</div>`).join("")}</div>`:"");}
function groupBy(arr,keyFn){const g={};arr.forEach(a=>{const k=keyFn(a);if(k==null||k==="")return;(g[k]=g[k]||[]).push(a);});return g;}
function tipsFromGroups(groups,extra){const t={};Object.keys(groups).forEach(k=>t[k]=tipPeople(groups[k],extra));return t;}
function tipList(items,title,unit,cap){cap=cap||5;const agg={};items.filter(x=>x.n).forEach(x=>{const k=String(x.n).trim();agg[k]=(agg[k]||0)+(+x.v||0);});const arr=Object.keys(agg).map(k=>({n:k,v:agg[k]})).sort((a,b)=>b.v-a.v);const top=arr.slice(0,cap);
  return top.length?`<b>${title}</b><div class="tl">${top.map((r,i)=>`<div>${i+1}. ${shortName(r.n)} · ${nfmt(r.v)}${unit||""}</div>`).join("")}${arr.length>cap?`<div class="tm">+${arr.length-cap} más…</div>`:""}</div>`:"";}
function tipsTopN(groups,mapFn,title,unit,cap){const t={};Object.keys(groups).forEach(k=>t[k]=tipList(groups[k].map(mapFn),title,unit,cap));return t;}
function wireTips(){if(window.__tipwired)return;window.__tipwired=true;const tip=document.getElementById("tip");

function cellInput(kind,ri,col,val){val=val==null?"":val;const at=`data-cell="${kind}" data-ri="${ri}" data-col="${col}"`;
  if(col==="motivo")return sel(at,MOTIVOS,val);
  if(col==="recomienda")return sel(at,["","Sí","No"],val);
  if(col==="tipo"&&kind==="activos")return sel(at,CONTRATO,val);
  if(col==="tipo"&&kind==="ausencias")return sel(at,AUSTIPOS,val);
  if(col==="departamento")return sel(at,DEPTS,val);
  if(col==="area"&&(kind==="activos"||kind==="extras"))return sel(at,AREAS,val);
  if(col==="sexo")return sel(at,SEXOS,val);
  if(col==="nivel_educativo")return sel(at,EDUC,val);
  if(col==="movilidad")return sel(at,MOVILM,val);
  if(col==="movimiento")return sel(at,MOVIMIENTO,val);
  if(col==="pais")return sel(at,PAISES,val);
  if(col==="area_conocimiento")return sel(at,AREAS_CONOC,val);
  if(col==="grupo")return sel(at,["Operaciones País","Oficina País"],val);
  if(["dias","nivel","paso","colaboradores","horas","participantes","cantidad"].includes(col))return`<input type="number" step="any" ${at} value="${val}" style="width:78px">`;
  if(col.startsWith("fecha"))return`<input type="date" ${at} value="${val}">`;
  return`<input type="text" ${at} value="${val}">`;}
function sel(at,opts,val){return`<select ${at}>${["",...opts].map(o=>`<option ${o===val?"selected":""}>${o}</option>`).join("")}</select>`;}

function toISODate(v){
  if(v==null||v==="")return "";
  if(v instanceof Date&&!isNaN(v)){return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`;}
  if(typeof v==="number"&&isFinite(v)){const dt=new Date(Math.round((v-25569)*86400000));if(!isNaN(dt))return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,"0")}-${String(dt.getUTCDate()).padStart(2,"0")}`;}
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;

function applyHHSheet(mat,fallbackYear){
  if(!mat||!mat.length)return 0;
  let section=null,colMap=null,year=fallbackYear||null;
  const acc={},ensure=mk=>acc[mk]||(acc[mk]={ord:0,ext:0,ordCat:{},extCat:{}});
  const isDate=v=>v instanceof Date||(v&&typeof v==="object"&&typeof v.getMonth==="function");
  mat.forEach(row=>{
    if(!row||!row.length)return;
    const txt=row.map(c=>typeof c==="string"?c.toLowerCase():"").join(" ");
    if(/horas ordinarias/.test(txt)){section="ord";colMap=null;return;}
    if(/horas extras/.test(txt)){section="ext";colMap=null;return;}
    let dc=0;const cm={};
    row.forEach((c,i)=>{if(isDate(c)){cm[i]=c.getMonth()+1;year=c.getFullYear();dc++;}});
    if(dc>=3){colMap=cm;return;}
    if(!section||!colMap||!year)return;
    const label=(row.find(c=>typeof c==="string"&&c.trim())||"").trim();
    if(!label)return;
    if(/^total/i.test(label)){section=null;return;}
    Object.keys(colMap).forEach(ci=>{const v=+row[ci];if(!isNaN(v)&&v){const mk=`${year}-${String(colMap[ci]).padStart(2,"0")}`;const a=ensure(mk);a[section]+=v;const co=section==="ord"?a.ordCat:a.extCat;co[label]=(co[label]||0)+v;}});
  });
  let n=0;
  Object.keys(acc).forEach(mk=>{const a=acc[mk],tot=a.ord+a.ext;if(tot<=0)return;const p=M(mk).params;p.hh_ord=Math.round(a.ord);p.hh_ext=Math.round(a.ext);p.horas_hombre=Math.round(tot);p.hh_cat=a.ordCat;n++;});
  return n;
}

/* ===== Vista Corporativa · matriz de indicadores estilo reporte ===== */
function presPeriodo(yr){
  const mk=monthsOf(yr).filter(hasData);
  if(!mk.length)return "01-"+String(yr).slice(2)+" / 12-"+String(yr).slice(2);
  const a=mk[0].slice(5,7)+"-"+mk[0].slice(2,4), b=mk[mk.length-1].slice(5,7)+"-"+mk[mk.length-1].slice(2,4);
  return a+" / "+b;
}
function presNum(v,dec){return (Math.round(v*Math.pow(10,dec))/Math.pow(10,dec)).toLocaleString("es-CR",{minimumFractionDigits:dec,maximumFractionDigits:dec});}
function presCell(it,mk){
  if(!hasData(mk))return {t:"",na:true};
  const _C=CUR;CUR=mk;const c=compute(mk);
  let ok;try{ok=(it.info||it.esl)?(c.ind[it.k]!=null):kpiValid(it.k,c);}catch(e){ok=true;}
  if(ok&&it.k==="dias_sin_acc"){const p=(DB[mk]&&DB[mk].params)||{};ok=!!p.fecha_ult_accidente;} // no arrastrar la fecha global
  const v=c.ind[it.k];CUR=_C;
  if(!ok||v==null||isNaN(v))return {t:"",na:true};
  const disp=it.type==="pct"?v*100:v, dec=it.type==="int"?0:1;
  if(Math.abs(disp)<Math.pow(10,-dec)/2)return {t:"",na:true}; // 0 = sin dato → vacío
  return {t:presNum(disp,dec)};
}
// Puntaje 0–100 del mes (mismo criterio del Índice Global de Gestión)
function presScore(mk){
  if(!hasData(mk))return null;
  const _C=CUR,_V=VIEW; CUR=mk; VIEW="mes";
  const c=compute(mk); const st=[];
  KPI.forEach(g=>g.items.forEach(it=>{ if(it.info||it.esl)return; if(!kpiOn(it.k))return; if(!kpiValid(it.k,c))return;
    const s=sem(it,c.ind[it.k],true); if(s!=="na")st.push(s); }));
  CUR=_C; VIEW=_V;
  if(!st.length)return null;
  const ok=st.filter(s=>s==="ok").length,w=st.filter(s=>s==="warn").length,b=st.filter(s=>s==="danger").length;
  return Math.round((ok*100+w*60+b*20)/st.length);
}
const PRES_HEAD={"Rotación":"rot_total","Reclutamiento y Selección":"nuevos","Ausentismo y bienestar":"ausentismo","Capacitación":"cap_horas","Desarrollo":"promo","Seguridad y Salud Laboral":"dias_sin_acc","Servicios Generales":"mant"};
let PRES_GRP="__all__";

    const sg=document.getElementById("presGrp");if(sg)sg.onchange=()=>{PRES_GRP=sg.value;renderPres();};
    const sy=document.getElementById("presAnio");if(sy)sy.onchange=()=>{YEAR=+sy.value;MONTHS=monthsOf(YEAR);CUR=`${YEAR}-${CUR.slice(5,7)}`;if(YEAR2>=YEAR)YEAR2=YEAR-1;renderPres();};
    return;
  }
  h+=`<div class="pbi-scroll"><table class="pbi-tbl"><thead><tr>
     <th class="desc">Descripción <span class="pbi-caret">▲</span></th>`;
  months.forEach((mk,i)=>{h+=`<th class="${i===curIdx?"cur":""}">${MSHORT[mi(mk)]}-${mk.slice(2,4)}</th>`;});
  h+=`<th class="acc">${YEAR}</th>`;
  h+=`</tr></thead><tbody>`;
  const curCls=i=>i===curIdx?"cur":"";
  const numCell=(v,i,dec)=>{const na=(v==null||isNaN(v)||Math.abs(v)<Math.pow(10,-dec)/2);return `<td class="${curCls(i)} ${na?"pbi-na":""}">${na?"·":presNum(v,dec)}</td>`;};
  const dataMonths=months.filter(hasData);
  const accCell=(v,dec)=>{const na=(v==null||isNaN(v)||Math.abs(v)<Math.pow(10,-dec)/2);return `<td class="acc ${na?"pbi-na":""}">${na?"·":presNum(v,dec)}</td>`;};
  const avgOf=getFn=>{let s=0,n=0;dataMonths.forEach(mk=>{const x=getFn(mk);if(x!=null&&!isNaN(x)&&Math.abs(x)>1e-9){s+=x;n++;}});return n?s/n:null;};
  const closeOf=getFn=>{for(let i=dataMonths.length-1;i>=0;i--){const x=getFn(dataMonths[i]);if(x!=null&&!isNaN(x)&&Math.abs(x)>1e-9)return x;}return null;};
  const maxOf=getFn=>{let m=null;dataMonths.forEach(mk=>{const x=getFn(mk);if(x!=null&&!isNaN(x)&&Math.abs(x)>1e-9){if(m==null||x>m)m=x;}});return m;};
  // Acumulado anual de un indicador KPI:
  //  · por defecto = SUMA de los valores mensuales (p. ej. rotación acumulada = Σ rotaciones mensuales; horas, accidentes, cursos = total del año)
  //  · niveles/promedios que no se pueden sumar = valor al cierre (último mes con dato)
  const LEVEL_K=["dias_sin_acc","encuesta","sucesion","dias_vacante"];
  const AVG_K=["mant","ot_dias","mant_prev"]; // Servicios Generales: cumplimiento OT, días de cierre OT y % mantenimiento preventivo = promedio del año
  function accKPI(it){
    if(!dataMonths.length)return null;
    const k=it.k;
    if(k==="record_dias")return maxOf(mk=>compute(mk).ind[k]); // récord = máximo del año (mes en que se alcanzó)
    if(AVG_K.includes(k))return avgOf(mk=>compute(mk).ind[k]); // promedio
    if(LEVEL_K.includes(k))return closeOf(mk=>compute(mk).ind[k]); // cierre
    let s=0,any=false;dataMonths.forEach(mk=>{const v=compute(mk).ind[k];if(v!=null&&!isNaN(v)){s+=v;any=true;}});return any?s:null; // suma
  }
  const accType=(it)=>{const v=accKPI(it);if(v==null||isNaN(v))return null;return it.type==="pct"?v*100:v;};
  const accDec=(it)=>it.type==="pct"?1:it.type==="int"?0:1;
  const sumOf=getFn=>{let s=0,any=false;dataMonths.forEach(mk=>{const x=getFn(mk);if(x!=null&&!isNaN(x)){s+=x;any=true;}});return any?s:null;};
  const _blocks=[];
  const _emit=(name,fn)=>{const keep=h;h="";fn();_blocks.push({name,html:h});h=keep;};
  // ---- Colaboradores (OLO + Terceros) · grupo colapsable ----
  _emit("Colaboradores",()=>{
  const terc=mk=>{if(!hasData(mk))return 0;return (M(mk).terceros||[]).filter(x=>PAIS==="__all__"||x.pais===PAIS).reduce((s,x)=>s+(+x.cantidad||0),0);};
  const olo=mk=>hasData(mk)?compute(mk).hcTot:null;

  months.forEach((mk,i)=>{h+=numCell(colabTot(mk),i,0,true);});

  h+=`</tr>`;
  [{name:"Nómina",get:olo},{name:"Terceros",get:mk=>hasData(mk)?terc(mk):null}].slice().sort((a,b)=>a.name.localeCompare(b.name,"es")).forEach(e=>{

  if(PRES_GRP==="__all__"||PRES_GRP==="Horas hombre"){_emit("Horas hombre",()=>{
    const hhTot=mk=>{if(!hasData(mk))return null;const p=M(mk).params;return (+p.horas_hombre||0)||((+p.hh_ord||0)+(+p.hh_ext||0))||compute(mk).extrasTot||null;};
    const hhExt=mk=>{if(!hasData(mk))return null;const p=M(mk).params;return (+p.hh_ext||0)||compute(mk).extrasTot||null;};
    const hhOrd=mk=>hasData(mk)?(+M(mk).params.hh_ord||0)||null:null;
    h+=`<tr class="pbi-grp" data-grp="hh"><td class="desc"><span class="pbi-exp">+</span>Horas hombre</td>`;
    months.forEach((mk,i)=>{h+=numCell(hhTot(mk),i,0,false);});
    h+=accCell(sumOf(hhTot),0);
    h+=`</tr>`;
    const HH=[{name:"Horas ordinarias (h)",get:hhOrd},{name:"Horas extras (h)",get:hhExt}].slice().sort((a,b)=>a.name.localeCompare(b.name,"es"));
    HH.forEach(e=>{h+=`<tr class="pbi-child hide" data-grp="hh"><td class="desc">${e.name}</td>`;months.forEach((mk,i)=>{h+=numCell(e.get(mk),i,0,false);});h+=accCell(sumOf(e.get),0);h+=`</tr>`;});
  });}
  // Indicadores del dashboard que no están en el catálogo KPI, agregados por grupo
  const EXTRA_DET={};
  const groups=KPI.filter(g=>PRES_GRP==="__all__"||g.g===PRES_GRP).slice().sort((a,b)=>a.g.localeCompare(b.g,"es"));
  groups.forEach((g,gi)=>{
    const its=g.items.filter(it=>kpiOn(it.k)).slice().sort((a,b)=>a.name.localeCompare(b.name,"es"));
    if(!its.length)return;
    let headIt=KMAP[PRES_HEAD[g.g]];if(!headIt||!kpiOn(headIt.k))headIt=its.find(it=>!it.info&&!it.esl)||its[0];
    // fila de grupo (colapsable) con el indicador cabecera
    const _gname=g.g?g.g.charAt(0).toUpperCase()+g.g.slice(1).toLowerCase():g.g;
    _emit(_gname,()=>{
    h+=`<tr class="pbi-grp" data-grp="${gi}"><td class="desc"><span class="pbi-exp">+</span>${_gname}</td>`;
    months.forEach((mk,i)=>{const c=presCell(headIt,mk);h+=`<td class="${curCls(i)} ${c.na?"pbi-na":""}">${c.t||"·"}</td>`;});
    h+=accCell(accType(headIt),accDec(headIt));
    h+=`</tr>`;
    // filas detalle (indicadores del grupo)
    its.forEach(it=>{
      h+=`<tr class="pbi-child hide" data-grp="${gi}"><td class="desc">${it.name}${it.unit?` <span style="color:#aaa">(${it.unit})</span>`:""}</td>`;
      months.forEach((mk,i)=>{const c=presCell(it,mk);h+=`<td class="${curCls(i)} ${c.na?"pbi-na":""}">${c.t||"·"}</td>`;});
      h+=accCell(accType(it),accDec(it));
      h+=`</tr>`;
    });
    (EXTRA_DET[g.g]||[]).forEach(e=>{h+=`<tr class="pbi-child hide" data-grp="${gi}"><td class="desc">${e.name}</td>`;months.forEach((mk,i)=>{h+=numCell(e.get(mk),i,e.dec,e.zeroOk);});h+=accCell(e.acc==="sum"?sumOf(e.get):avgOf(e.get),e.dec);h+=`</tr>`;});
    });
  });
  // Grupo adicional: Perfil del colaborador (edad y antigüedad promedio) · acum = valor al cierre
  if(PRES_GRP==="__all__"||PRES_GRP==="Perfil del colaborador"){_emit("Perfil del colaborador",()=>{
    const edad=mk=>hasData(mk)?compute(mk).edadProm:null, antig=mk=>hasData(mk)?compute(mk).antigProm:null;
    h+=`<tr class="pbi-grp" data-grp="perfil"><td class="desc"><span class="pbi-exp">+</span>Perfil del colaborador</td>`;
    months.forEach((mk,i)=>{h+=numCell(edad(mk),i,1,false);});
    h+=accCell(avgOf(edad),1);
    h+=`</tr>`;
    const PERFIL=[{name:"Edad promedio (años)",get:edad},{name:"Antigüedad promedio (años)",get:antig}].slice().sort((a,b)=>a.name.localeCompare(b.name,"es"));
    PERFIL.forEach(e=>{h+=`<tr class="pbi-child hide" data-grp="perfil"><td class="desc">${e.name}</td>`;months.forEach((mk,i)=>{h+=numCell(e.get(mk),i,1,false);});h+=accCell(avgOf(e.get),1);h+=`</tr>`;});
  });}
  _blocks.sort((a,b)=>a.name.localeCompare(b.name,"es")).forEach(b=>h+=b.html);
  // fila Total (Índice Global) removida de la Vista Corporativa por solicitud
  h+=`</tbody></table></div>
  </div>`;
  const root=document.getElementById("v-pres"); root.innerHTML=h; wirePresTabs(root);
  // wiring
  const selP=document.getElementById("presPais"); if(selP)selP.onchange=()=>{PAIS=selP.value;renderPres();};

  root.querySelectorAll(".pbi-grp").forEach(row=>{

  });
}

/* ============================================================
 * OLO · Sincronización con Supabase — tabla PROPIA olo_indicadores_kv
 * No toca olo_kv ni las demás tablas (son de otros proyectos).
 * Respeta la estructura DB local sin tocar el diseño ni la lógica:
 * pull al iniciar, push al guardar.
 * ============================================================ */
const OLOSync=(function(){
  const SB_URL="https://iigtulgpbqeypnewmzxz.supabase.co";
  const SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpZ3R1bGdwYnFleXBuZXdtenh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MTU3OTgsImV4cCI6MjA5OTA5MTc5OH0.kFqdbOiRKjyNJ5H-vCvNd3SrC7lamYtN3WyIY8rpetU";
  const TABLE="olo_indicadores_kv"; // tabla exclusiva de este proyecto
  let sb=null;
  function client(){if(sb)return sb;if(!window.supabase||!window.supabase.createClient)return null;sb=window.supabase.createClient(SB_URL,SB_ANON);return sb;}
  async function pull(){const c=client();if(!c)throw new Error("Supabase no disponible");const r=await c.from(TABLE).select("key,value");if(r.error)throw r.error;const db={};(r.data||[]).forEach(x=>{db[x.key]=x.value;});if(Object.keys(db).length){localStorage.setItem("olo_master_db",JSON.stringify(db));}return (r.data||[]).length;}
  async function push(){const c=client();if(!c)throw new Error("Supabase no disponible");let db={};try{db=JSON.parse(localStorage.getItem("olo_master_db")||"{}");}catch(e){}const rows=Object.keys(db).map(k=>({key:k,value:db[k]}));if(!rows.length)return 0;const r=await c.from(TABLE).upsert(rows,{onConflict:"key"});if(r.error)throw r.error;return rows.length;}
  return {pull,push,available:()=>!!client()};
})();

// Push automático (con rebote) cada vez que se guarda localmente
let _syncTimer=null;
(function(){const _origSave=save;save=function(){_origSave.apply(this,arguments);if(!OLOSync.available())return;clearTimeout(_syncTimer);_syncTimer=setTimeout(()=>{OLOSync.push().catch(e=>console.warn("[OLOSync] push:",e&&e.message));},1200);};})();

(function(){const b=document.getElementById("syncBtn");if(!b)return;b.onclick=async()=>{if(!OLOSync.available()){toast("Supabase no disponible");return;}const t0=b.textContent;b.textContent="Sincronizando…";try{const n=await OLOSync.pull();load();renderAll();toast("☁ Sincronizado · "+n+" registro(s)");}catch(e){toast("Error de sincronización");console.warn("[OLOSync]",e);}b.textContent=t0;};})();

// Arranque: intenta traer de la nube; si no hay datos o falla, usa local
(async function(){
  let usedCloud=false;
  if(OLOSync.available()){
    try{const n=await OLOSync.pull();usedCloud=n>0;}catch(e){console.warn("[OLOSync] pull inicial:",e&&e.message);}
  }
  load();renderAll();
  // Si la nube estaba vacía pero hay datos locales, súbelos una vez
  if(OLOSync.available()&&!usedCloud){OLOSync.push().catch(()=>{});}
})();
